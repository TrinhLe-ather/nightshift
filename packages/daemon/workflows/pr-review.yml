name: PR Review
description: Comprehensive pull request review
version: 1.0.0

inputs:
  prUrl:
    type: string
    description: URL to the pull request
    required: true

steps:
  - name: Fetch PR
    prompt: |
      Fetch and checkout the pull request: {{prUrl}}

      Review the changes and provide a summary of:
      - Files changed
      - Key modifications
      - Overall scope
    tools:
      enable: [Bash, Read, Grep]

  - name: Code Quality Review
    prompt: |
      Review the code changes for:

      1. Code quality and readability
      2. Potential bugs or edge cases
      3. Performance considerations
      4. Security issues
      5. Test coverage

      List specific issues with file:line references.
    tools:
      enable: [Read, Grep, Bash]

  - name: Suggest Improvements
    prompt: |
      Based on your review, suggest concrete improvements.

      For each issue, provide:
      - Severity (critical/major/minor/suggestion)
      - Explanation
      - Suggested fix (if applicable)

      Format as markdown for posting as PR comment.
    tools:
      enable: [Read]

  - name: Post Review Comment
    prompt: |
      Post your review as a GitHub comment on the PR.

      Use a constructive, helpful tone.
      Group issues by severity.
    tools:
      enable: [Bash]
