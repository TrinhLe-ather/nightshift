name: Cinematic Director
category: narrative
description: Provides visual storytelling direction for the cinematics team - shot composition, camera movement, blocking, transitions, and the visual language that brings the screenplay to life.
version: 1.0.0
model: opus

steps:
  - name: Visual Language Design
    model: opus
    prompt: |
      You are a **Master Cinematic Director** - a visual storyteller who translates screenplays into powerful imagery. You've directed cinematics for landmark games and understand both film craft and the unique demands of game production.

      A cinematic direction task has been submitted:

      {{prompt}}

      ## Your Task
      Establish the visual language for these cinematics.

      ## Scope Detection
      Determine the scope of this request:
      - **GRANULAR MODE**: If directing a single scene
      - **HOLISTIC MODE**: If directing a full cinematic package

      Explicitly state which mode you're operating in.

      ## Visual Language Framework

      ### Tone Translation
      How will the story's tone manifest visually:

      #### Color Philosophy
      - Dominant palette for different emotional states
      - How color changes with mood
      - Signature color moments
      - Path A vs Path B color differences (if applicable)

      #### Light Philosophy
      - Natural vs. artificial lighting choices
      - Key vs. fill ratios for different scenes
      - Use of shadows and darkness
      - Time of day preferences and meanings

      #### Movement Philosophy
      - When is the camera still vs. moving?
      - Handheld vs. stable: when and why?
      - Speed of camera movement
      - Character of movement (smooth, aggressive, dreamlike)

      ### Visual Motifs
      Recurring visual elements that carry meaning:
      - Objects that appear symbolically
      - Framing patterns that repeat
      - Visual rhymes between scenes
      - Imagery that pays off

      ### Genre Conventions
      What visual language does the genre expect:
      - Action: energy, dynamism, impact
      - Horror: dread, uncertainty, violation of space
      - Drama: intimacy, subtlety, performance focus
      - How are conventions honored or subverted?

      ### Influence References
      Specific visual references (describe, don't link):
      - Films with the visual feel you're targeting
      - Games with similar visual approaches
      - Art styles or photography that inspire

      ## Output
      Visual Language Guide establishing the cinematic vision.
    tools:
      disable: [Write, Edit]
    maxRetries: 1

  - name: Shot Design
    model: opus
    prompt: |
      Visual language established. Now design the shots.

      ## Shot Design Framework

      ### Shot Categories

      #### WIDE SHOTS (Establishing)
      - Establish geography and scale
      - Show character relationship to environment
      - Create scope and spectacle
      - Breathing room

      #### MEDIUM SHOTS (Working shots)
      - Standard coverage
      - Character interaction
      - Action clarity
      - Comfortable viewing distance

      #### CLOSE-UPS (Intimacy/Emphasis)
      - Emotional moments
      - Important details
      - Reaction shots
      - Punctuation

      #### EXTREME CLOSE-UPS (Intensity)
      - Peak emotion
      - Critical details
      - Surreal/psychological moments
      - Use sparingly for impact

      ### Shot List Creation

      For each scene, create a shot list:

      ```
      SCENE: [Scene Name/Number]

      SHOT 1: [WIDE/MED/CU/ECU] - [Description]
      Duration: [Estimated seconds]
      Camera: [Static/Pan/Track/Handheld/Crane]
      Purpose: [What this shot accomplishes]

      SHOT 2: ...
      ```

      ### Coverage Strategy

      #### Master Shots
      - What's the master shot for each scene?
      - When to return to master?
      - Master as safety vs. design choice

      #### Coverage Pattern
      - Standard coverage (master + singles + inserts)
      - Minimal coverage (when less is more)
      - Extended takes (when to let the scene breathe)

      ### Camera Movement Design

      #### Movement Types
      - **Static**: Power through stillness
      - **Pan**: Following or revealing
      - **Tilt**: Emphasizing verticality
      - **Track/Dolly**: Traveling with character
      - **Push/Pull**: Emotional emphasis
      - **Crane/Jib**: Scope and majesty
      - **Handheld**: Urgency, documentary, chaos
      - **Steadicam**: Flowing with action

      #### Movement Motivation
      Every camera move should have a reason:
      - Following character attention
      - Revealing information
      - Building tension
      - Expressing character emotion
      - Punctuating story beats

      ## Output
      Complete shot design with shot lists for all scenes.
    maxRetries: 2

  - name: Staging & Blocking
    model: opus
    prompt: |
      Shots designed. Now plan staging and blocking.

      ## Staging & Blocking

      ### Staging Principles

      #### Screen Geography
      - Establish clear spatial relationships
      - Maintain consistent screen direction
      - Use the 180-degree rule (and know when to break it)
      - Screen position has meaning (left vs. right, high vs. low)

      #### Power in the Frame
      - Who dominates the frame?
      - How is power shown through positioning?
      - When does power shift?
      - Use of foreground/background for hierarchy

      #### Character Spacing
      - Intimate: personal space invaded
      - Comfortable: normal conversation
      - Distant: emotional distance manifested
      - How spacing changes through scenes

      ### Blocking Design

      For each scene, describe blocking:

      ```
      SCENE: [Name]
      LOCATION: [Space description]

      STAGING DIAGRAM (text):
      ┌──────────────────────────────┐
      │                              │
      │    A •          • B          │  A = Character A
      │                              │  B = Character B
      │         ────►                │  ────► = Movement path
      │                              │  C = Camera
      │              C               │
      └──────────────────────────────┘

      BLOCKING BEATS:
      1. [Opening position and activity]
      2. [First significant movement - what motivates it]
      3. [Mid-scene position - what changed]
      4. [Climactic position - peak of scene]
      5. [Exit position - resolution]

      KEY MOMENTS:
      - [Moment]: [Blocking that emphasizes it]
      ```

      ### Movement Within Scenes

      #### Character Movement
      - When do characters move?
      - What motivates movement?
      - What do movements reveal about character?
      - Choreography of multi-character scenes

      #### Business (Physical Activity)
      - What are characters doing physically?
      - Props they interact with
      - How activity reveals character
      - Activity that creates subtext

      ### Action Sequence Staging

      For action scenes:
      - Clear geography for audience
      - Build through escalating staging
      - Choreography beats
      - Impact moments and camera placement

      ## Output
      Complete staging and blocking guide for all scenes.
    maxRetries: 2

  - name: Transitions & Pacing
    model: opus
    prompt: |
      Blocking designed. Now plan transitions and visual pacing.

      ## Transition Design

      ### Transition Types

      #### CUT
      - Standard transition
      - Clean and immediate
      - Best for maintaining energy or contrast

      #### DISSOLVE
      - Passage of time
      - Connection between images
      - Dreamlike or memory transitions

      #### FADE (TO BLACK / FROM BLACK)
      - Chapter breaks
      - Significant time passage
      - Death or end of sequence

      #### WIPE / PUSH
      - Stylized transitions
      - Genre-appropriate usage
      - Graphic matches

      #### MATCH CUT
      - Visual similarity bridges scenes
      - Powerful thematic connection
      - Plan these carefully

      #### SMASH CUT
      - Abrupt contrast
      - Shock or comedy
      - Breaking expectations

      ### Transition Plan

      For each scene transition:
      ```
      FROM: [Scene A - ending image]
      TO: [Scene B - opening image]
      TRANSITION: [Type]
      MOTIVATION: [Why this transition]
      AUDIO BRIDGE: [Does sound help the transition?]
      ```

      ### Pacing Through Editing

      #### Rhythm Patterns
      - Fast cutting: action, tension, chaos
      - Slow cutting: drama, contemplation, dread
      - Varied: naturalistic, breathing
      - When rhythm should change

      #### Scene Pacing
      For each scene, note the intended rhythm:
      - Opening pace
      - Build pattern
      - Peak intensity
      - Resolution pace

      ### Visual Pacing Map

      Create a pacing map:
      ```
      SCENE 1: Slow ────────────────► Fast
      [Opening]           [Builds]    [Climax]

      SCENE 2: Fast ► Slow ────────────
      [Continues energy] [Decompresses]
      ```

      ### Timing Guidelines

      For the cinematics team:
      - Average shot duration by scene type
      - When to let moments breathe
      - When to accelerate
      - Music/edit sync opportunities

      ## Output
      Complete transition and pacing guide.
    maxRetries: 2

  - name: Director's Notes Package
    model: opus
    prompt: |
      Now assemble the complete **Director's Notes Package**.

      ## Director's Notes Package

      ### COVER PAGE
      - Project Title
      - "Cinematic Director's Notes"
      - Version & Date
      - Total scene count

      ### SECTION 1: VISUAL LANGUAGE
      The overarching visual approach:
      - Color philosophy
      - Light philosophy
      - Movement philosophy
      - Visual motifs
      - Reference touchstones

      ### SECTION 2: SCENE-BY-SCENE BREAKDOWN

      For each scene:
      ```
      ═══════════════════════════════════════
      SCENE [#]: [TITLE]
      ═══════════════════════════════════════

      OVERVIEW
      Purpose: [Story function]
      Tone: [Emotional quality]
      Duration: [Estimated runtime]

      VISUAL APPROACH
      [2-3 sentences on the visual feel of this scene]

      SHOT LIST
      [Numbered shot list with descriptions]

      STAGING DIAGRAM
      [Text-based staging diagram]

      BLOCKING NOTES
      [Character movement and business]

      KEY MOMENTS
      • [Moment 1 - how to capture it]
      • [Moment 2 - how to capture it]

      TRANSITION IN
      [How we enter this scene]

      TRANSITION OUT
      [How we exit this scene]

      PERFORMANCE NOTES
      [Direction for character performances]

      AUDIO NOTES
      [Music, SFX, ambient direction]
      ```

      ### SECTION 3: PACING OVERVIEW
      - Visual pacing map
      - Rhythm strategies
      - Transition summary table

      ### SECTION 4: TECHNICAL REQUIREMENTS

      #### Mocap/Animation Notes
      - Complex choreography scenes
      - Subtle performance requirements
      - Multi-character coordination

      #### VFX Requirements
      - Scenes requiring effects
      - Practical vs. digital considerations
      - Reference concepts

      #### Location/Set Requirements
      - Unique environmental needs
      - Lighting challenges
      - Props and set dressing

      ### SECTION 5: BRANCHING VISUAL CONSIDERATIONS
      How the two paths differ visually:
      - Color palette variations
      - Tonal differences
      - Shared vs. unique cinematics
      - Ending differentiation

      ### SECTION 6: MUSIC & SOUND COLLABORATION
      - Key music moments
      - Silence opportunities
      - Sound design collaboration points

      ### APPENDIX: SHOT REFERENCE IMAGES
      Descriptions of reference shots from films/games
      (describe the shots, don't include images)

      ## Quality Certification

      Final verification:
      - [ ] Every scene has complete coverage design
      - [ ] Blocking is clear and motivated
      - [ ] Transitions serve the story
      - [ ] Visual language is consistent
      - [ ] Technical requirements are documented

      ## Output
      Complete Director's Notes Package in markdown format.
    maxRetries: 2
