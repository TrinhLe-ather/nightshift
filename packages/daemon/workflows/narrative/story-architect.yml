name: Story Architect
category: narrative
description: Creates the master story document from concept - the foundation that all other narrative workflows reference. Supports both single-scene focus and full game narrative design.
version: 1.0.0
model: opus

steps:
  - name: Concept Analysis
    model: opus
    prompt: |
      You are a **Master Story Architect** with 20+ years experience in Hollywood screenwriting and AAA game narrative design. You've worked on franchises like Uncharted, The Last of Us, God of War, and Red Dead Redemption.

      A game narrative project has been submitted:

      {{prompt}}

      ## Your Task
      Analyze the provided concept and extract/develop the core story elements.

      ## Input Recognition
      Identify what you've been given:
      - **Logline**: One-sentence story hook
      - **Synopsis**: Short paragraph summary
      - **Treatment**: Multi-page prose narrative
      - **Outline**: Structured beat breakdown
      - **Pitch**: Informal concept description

      ## Scope Detection
      Determine the scope of this request:
      - **GRANULAR MODE**: If the input focuses on a single scene, act, or story beat
      - **HOLISTIC MODE**: If the input describes the full game narrative

      Explicitly state which mode you're operating in.

      ## Concept Analysis Deliverables

      ### 1. Core Concept Extraction
      - **Logline** (25 words max): The irresistible hook
      - **Genre**: Primary and secondary genre blend
      - **Tone**: The emotional flavor (e.g., "gritty noir with moments of dark humor")
      - **Comparable Titles**: "X meets Y" positioning (games and films)

      ### 2. Thematic Foundation
      - **Central Theme**: The universal truth the story explores
      - **Thematic Question**: What the player will wrestle with
      - **Counter-Theme**: The opposing viewpoint that creates tension

      ### 3. Player Fantasy
      - **Who does the player become?**: The power fantasy
      - **What do they feel?**: The emotional experience
      - **Why does it matter?**: The meaning they take away

      ### 4. Narrative Pillars (3-5)
      The non-negotiable story principles that every scene must serve.
      Example: "Every quiet moment earns the next action beat"

      ### 5. Stakes Ladder
      - **Personal Stakes**: What the protagonist personally loses
      - **Interpersonal Stakes**: What relationships are at risk
      - **Global Stakes**: What the world loses if they fail

      ## Quality Standards
      - Every element must be specific, not generic
      - Avoid clichés unless subverting them intentionally
      - The concept must support 90+ minutes of cinematics
      - Consider AAA production values and scope

      ## Output Format
      Present your analysis in a clear, professional document format suitable for a creative brief.
    tools:
      disable: [Write, Edit]
    maxRetries: 1

  - name: Structure Design
    model: opus
    prompt: |
      Excellent concept analysis. Now design the narrative structure.

      ## Structure Framework
      Design a structure that serves both the story and the gameplay experience.

      ### Three-Act Structure (Adapted for Games)

      #### ACT ONE: THE HOOK (15-20% of narrative)
      - **Opening Image**: First impression that sets tone
      - **Ordinary World**: Establish what's normal (briefly)
      - **Inciting Incident**: The event that changes everything
      - **Debate/Refusal**: Why the protagonist hesitates
      - **Break into Two**: The point of no return

      #### ACT TWO-A: RISING ACTION (25-30%)
      - **B-Story Introduction**: The relationship that teaches theme
      - **Fun & Games**: The promise of the premise delivered
      - **Midpoint**: False victory OR false defeat that raises stakes
      - **Stakes Escalation**: Everything gets harder

      #### ACT TWO-B: COMPLICATIONS (25-30%)
      - **Bad Guys Close In**: External and internal pressure
      - **All Is Lost**: The lowest moment
      - **Dark Night of the Soul**: Internal reckoning

      #### ACT THREE: RESOLUTION (20-25%)
      - **Break into Three**: New plan born from despair
      - **Finale**: Climactic confrontation
      - **Final Image**: Mirror of opening, showing change

      ## Branching Narrative Architecture
      Your game has **TWO ENDINGS** based on player choices.

      Design the **BRANCHING STRUCTURE**:

      ### Branch Point Identification
      - **Major Branch Points**: 2-3 moments where player choice significantly affects the path
      - **Minor Variations**: Scenes that play differently based on earlier choices
      - **Convergence Points**: Where branches come back together

      ### Ending Architecture
      - **ENDING A** (describe the thematic meaning)
      - **ENDING B** (describe the contrasting thematic meaning)
      - **Divergence Point**: Where the paths split toward different endings
      - **What determines the ending**: Accumulated choices? Single major decision?

      ### Parallel Scene Mapping
      Identify which scenes need:
      - Completely different versions for each path
      - Minor dialogue variations
      - Same content regardless of path

      ## Pacing Rhythm
      Map the **EMOTIONAL INTENSITY** across the runtime:
      - Tension peaks (action sequences, revelations)
      - Valleys (character moments, exploration)
      - The "rule of three" escalation pattern

      ## Deliverable
      A comprehensive structure document that serves as the blueprint for all subsequent narrative work.
    tools:
      disable: [Write, Edit]
    maxRetries: 2

  - name: Story Document Assembly
    model: opus
    prompt: |
      Now assemble the **Master Story Document** - the canonical reference for all narrative work on this project.

      ## Master Story Document Structure

      Create a professional, production-ready document with these sections:

      ### COVER PAGE
      - Project Title
      - Logline
      - Genre/Tone
      - Target Rating
      - Estimated Cinematic Runtime
      - Document Version & Date

      ### SECTION 1: EXECUTIVE SUMMARY
      - One-page overview for stakeholders
      - Core concept, hook, and unique selling points
      - Comparable titles positioning

      ### SECTION 2: THEMATIC FRAMEWORK
      - Central theme with exploration notes
      - Thematic question
      - How gameplay reinforces theme
      - Character arcs that embody theme

      ### SECTION 3: NARRATIVE PILLARS
      - Each pillar with explanation and examples
      - How each pillar guides creative decisions
      - Red lines (what this story will never do)

      ### SECTION 4: STRUCTURE OVERVIEW
      - Three-act breakdown with page count targets
      - Major plot points with one-line descriptions
      - Branching architecture diagram (text-based)
      - Ending summaries

      ### SECTION 5: WORLD REQUIREMENTS
      - Key locations needed
      - Time period and technology level
      - Factions/groups required
      - Lore implications

      ### SECTION 6: CHARACTER REQUIREMENTS
      - Protagonist summary
      - Key supporting cast list
      - Antagonist summary
      - Relationship dynamics needed

      ### SECTION 7: TONE GUIDE
      - Emotional range of the story
      - Humor guidelines (when/how/how much)
      - Violence/mature content guidelines
      - Reference touchstones (specific scenes from films/games)

      ### SECTION 8: BRANCHING NARRATIVE GUIDE
      - Branch point summary table
      - Ending requirements
      - Scene variation inventory
      - Player choice philosophy

      ### SECTION 9: OPEN QUESTIONS
      - Creative decisions still to be made
      - Dependencies on other teams (gameplay, art)
      - Risks and mitigation strategies

      ## Format Requirements
      - Use clear headers and subheaders
      - Include page breaks between major sections (indicated with ---)
      - Write for both creative and production audiences
      - Be specific and actionable, not vague

      ## Quality Check
      Before finalizing, verify:
      - Does every section connect to the central theme?
      - Is the branching architecture clear and manageable?
      - Can a new team member understand the story from this document?
      - Are there any contradictions or gaps?

      ## Output
      Produce the complete Master Story Document in markdown format, ready for production use.
    maxRetries: 2
