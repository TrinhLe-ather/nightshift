name: Simple Task
description: Execute a single task with no predefined structure
version: 1.0.0

inputs:
  task:
    type: string
    description: What you want to accomplish
    required: true

steps:
  - name: Execute Task
    prompt: |
      {{task}}
    tools:
      enable: [Read, Write, Edit, Bash, Glob, Grep]
    autoCommit: true
