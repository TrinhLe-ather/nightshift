name: main-release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate dev version
        id: version
        run: |
          # Generate timestamp-based version for dev builds
          # Format: 0.0.0-dev.YYYYMMDD.HHMMSS
          TIMESTAMP=$(date -u +%Y%m%d.%H%M%S)
          DEV_VERSION="0.0.0-dev.${TIMESTAMP}"
          DEV_TAG="v${DEV_VERSION}"
          echo "version=${DEV_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${DEV_TAG}" >> $GITHUB_OUTPUT
          echo "Generated dev version: ${DEV_VERSION}"

      - name: Get build metadata
        id: meta
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build daemon binaries
        env:
          NIGHTSHIFT_BUILD_VERSION: ${{ steps.version.outputs.version }}
          NIGHTSHIFT_BUILD_COMMIT: ${{ steps.meta.outputs.short_sha }}
          NIGHTSHIFT_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: bun run daemon build

      - name: Create checksums
        run: |
          cd packages/daemon/dist
          sha256sum nightshift-* > SHA256SUMS
          cat SHA256SUMS

      - name: Delete old dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep only the 5 most recent dev releases
          gh release list --limit 100 | grep -E "^v0\.0\.0-dev\." | tail -n +6 | while read -r line; do
            tag=$(echo "$line" | awk '{print $1}')
            echo "Deleting old dev release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dev Build ${{ steps.version.outputs.version }}"
          body: |
            **Development build from main branch**

            This is an automated build from the latest `main` branch.
            Use the **latest** update channel to receive these builds.

            ⚠️ These builds may be unstable. Use at your own risk.
          prerelease: true
          files: |
            packages/daemon/dist/nightshift-darwin-arm64
            packages/daemon/dist/nightshift-linux-x64
            packages/daemon/dist/nightshift-windows-x64.exe
            packages/daemon/dist/SHA256SUMS
