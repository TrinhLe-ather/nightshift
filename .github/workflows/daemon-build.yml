name: daemon-build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon binaries
        run: bun run daemon build

      - name: List dist
        run: ls -la packages/daemon/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-daemon-${{ github.sha }}
          path: |
            packages/daemon/dist/nightshift-darwin-arm64
            packages/daemon/dist/nightshift-linux-x64
            packages/daemon/dist/nightshift-windows-x64.exe


