name: daemon-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon binaries
        env:
          NIGHTSHIFT_BUILD_VERSION: ${{ github.ref_name }}
          NIGHTSHIFT_BUILD_COMMIT: ${{ github.sha }}
          NIGHTSHIFT_BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: |
          # Strip leading "v" so VERSION remains semver-only
          export NIGHTSHIFT_BUILD_VERSION="${NIGHTSHIFT_BUILD_VERSION#v}"
          export NIGHTSHIFT_BUILD_COMMIT="$(echo "$NIGHTSHIFT_BUILD_COMMIT" | cut -c1-7)"
          export NIGHTSHIFT_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bun run daemon build

      - name: Create checksums
        run: |
          cd packages/daemon/dist
          sha256sum nightshift-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/daemon/dist/nightshift-darwin-arm64
            packages/daemon/dist/nightshift-linux-x64
            packages/daemon/dist/nightshift-windows-x64.exe
            packages/daemon/dist/SHA256SUMS


